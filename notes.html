  <style>

      body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
     h1 {
      font-family: 'Playfair Display', serif;
      margin-top: 60px;
      color: #3b594b;
      text-align: center;
      margin-bottom: 10px;
    }
    body.dark-mode .content-section h1 {
      color: #A3C28B;
    }

    body.dark-mode .external-card h3{
      color: #A3C28B;
    }

    h1 + p {
      text-align: center;
      margin-bottom: 40px;
    }


     .content-section p{
    color: black;
    font-size: 1rem;
    line-height: 1.6;    }
    
     body.dark-mode .content-section p {
      color: #ffffff;
    }

    body.dark-mode .content-section h1 {
      color: #A3C28B;
    }

    .notes-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 0 auto 60px auto;
    }

    .note-card {
      background: #fdfdfd;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
      background: 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }

     body.dark-mode .note-card i {
      font-size: 40px;
      color: #f7cf05;
      margin-bottom: 10px;
      transition: color 0.3s ease;
    }

    .note-card i {
      font-size: 40px;
      color: #A3C28B;
      margin-bottom: 10px;
      transition: color 0.3s ease;
      
    }

    .note-card h3 {
      margin-bottom: 10px;
      color: #000000;
      font-size: 20px;
    }

    body.dark-mode .note-card h3 {
      margin-bottom: 10px;
      color: #ffffff;
    }

    .note-card p {
      color: black;
      font-size: 14px;
    }

    .note-card:hover {
      transform: translateY(-5px) scale(1.03);
      background: #d4e0c0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    }

    body.dark-mode .note-card {
      background: #1f1f1f;
      color: #ddd;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    body.dark-mode .note-card:hover {
      background: #333;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

     body.dark-mode .note-card p {
      color: whitesmoke;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #f8f8f8;
      font-size: 13px;
      color: #666;
      margin-top: auto;
    }

    
/* =========================
 MOBILE 
========================= */
@media screen and (max-width: 768px) {

  .header {
    flex-direction: column;    
    align-items: center;       
    gap: 5px;                 
    padding: 8px 5%;          
  }

  .nav-left,
  .nav-right {
    flex-wrap: wrap;           
    justify-content: center;
    gap: 8px;                  
  }

  .header a {
    font-size: 12px;    
    padding: 5px 8px;
  }

  header .fa-brands {
    font-size: 20px;         
    padding: 5px;
  }
  
  /* ===== CONTENT SECION ===== */
  .content-section h1 {
    font-size: 2rem;      
    line-height: 1.2;
    margin: 1.5rem 0;
    padding-top: 10%;
  }

 .content-section p {
    font-size: 1rem;
    line-height: 1.6;
  }

  /* ===== CATEGORY CARDS ===== */
  
  .categories {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  padding: 30px 15px;
  justify-items: center; 
}

.note-card {
  width: 100%;
  max-width: 160px;
  padding: 18px 14px;
  margin: 0 auto;         
}
  .note-card h3 {
  font-size: 1rem;
  margin-bottom: 10px;
  }

  .categories h3{
      font-size: 1.1rem;
  }
  
  /* ===== FOOTER ===== */
  footer {
    font-size: 12px;
    padding: 16px;
  }
}
